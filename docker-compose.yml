version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: music-queue-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: music-queue-db-init
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-queue-backend
    # R14c: the single operator input ROOM_CUTOVER_AUTHORITATIVE (default
    # false) drives BOTH this backend runtime flag and the frontend build
    # argument below, so the pair can never be deployed half-cut-over from
    # one .env. The command mirrors the image CMD plus the explicit flag.
    command: ["/bin/sh", "-c", "crond && /app/setup-certs.sh && exec /app/server --room-cutover-authoritative=${ROOM_CUTOVER_AUTHORITATIVE:-false}"]
    ports:
      - "${BACKEND_PORT:-443}:443"  # HTTPS
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - HOST_EMAILS=${HOST_EMAILS}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      # PostgreSQL is the only persistence layer (R03).
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - backend-letsencrypt:/etc/letsencrypt
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        # R14c: baked from the SAME operator input as the backend runtime
        # flag above — one .env value flips both halves of the pair.
        VITE_ROOM_CUTOVER_AUTHORITATIVE: ${ROOM_CUTOVER_AUTHORITATIVE:-false}

    container_name: music-queue-frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"      # HTTP → HTTPS redirect
      - "${FRONTEND_HTTPS_PORT:-443}:443"   # HTTPS
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CERT_FILE=/etc/nginx/ssl/cert.crt
      - KEY_FILE=/etc/nginx/ssl/cert.key
    volumes:
      - frontend-letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  backend-letsencrypt:
    driver: local
  frontend-letsencrypt:
    driver: local