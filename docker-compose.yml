version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-queue-backend
    ports:
      - "${BACKEND_PORT:-443}:443"  # HTTPS
    volumes:
      - ./data:/app/data
      - ./letsencrypt-backend:/etc/letsencrypt  # Let's Encrypt certificates
      - ./certs:/app/certs  # Certificate symlinks
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - HOST_EMAILS=${HOST_EMAILS}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: music-queue-frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"      # HTTP → HTTPS redirect
      - "${FRONTEND_HTTPS_PORT:-443}:443"   # HTTPS
    volumes:
      - ./letsencrypt-frontend:/etc/letsencrypt  # Let's Encrypt certificates
      - ./frontend-certs:/etc/nginx/ssl  # Certificate symlinks
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CERT_FILE=/etc/nginx/ssl/cert.crt
      - KEY_FILE=/etc/nginx/ssl/cert.key
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
