version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: music-queue-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: music-queue-db-init
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-queue-backend
    ports:
      - "${BACKEND_PORT:-443}:443"  # HTTPS
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - HOST_EMAILS=${HOST_EMAILS}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      # When DATABASE_URL is set the backend uses PostgreSQL. The SQLite
      # source path and backend-db volume remain mounted for R02/R03 only
      # and are removed by R03 once the data migration is verified.
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - backend-db:/app/data
      - backend-letsencrypt:/etc/letsencrypt
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: music-queue-frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"      # HTTP → HTTPS redirect
      - "${FRONTEND_HTTPS_PORT:-443}:443"   # HTTPS
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CERT_FILE=/etc/nginx/ssl/cert.crt
      - KEY_FILE=/etc/nginx/ssl/cert.key
    volumes:
      - frontend-letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend-db:
    driver: local
  postgres-data:
    driver: local
  backend-letsencrypt:
    driver: local
  frontend-letsencrypt:
    driver: local