version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-queue-backend
    ports:
      - "${BACKEND_PORT:-443}:443"  # HTTPS
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - HOST_EMAILS=${HOST_EMAILS}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - backend-db:/app/data
      - backend-letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: music-queue-frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"      # HTTP → HTTPS redirect
      - "${FRONTEND_HTTPS_PORT:-443}:443"   # HTTPS
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CERT_FILE=/etc/nginx/ssl/cert.crt
      - KEY_FILE=/etc/nginx/ssl/cert.key
    volumes:
      - frontend-letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend-db:
    driver: local
  backend-letsencrypt:
    driver: local
  frontend-letsencrypt:
    driver: local
